backend:
  name: git-gateway
  branch: main

# Where uploaded images live in the repo
media_folder: "public/uploads"
# How those images are referenced from inside the site
public_folder: "/uploads"

# Friendlier site title in the admin
site_url: https://easyflux-consulting.netlify.app
display_url: https://easyflux-consulting.netlify.app
logo_url: https://easyflux-consulting.netlify.app/favicon.svg

collections:
  - name: "site"
    label: "Site content"
    description: "Edit the main pieces of text on your homepage. Save changes to publish."
    files:
      - file: "content/site.yml"
        label: "Homepage"
        name: "homepage"
        fields:
          - { label: "Hero — line 1 (navy)", name: "hero_headline_1", widget: "string", default: "Better healthcare," }
          - { label: "Hero — line 2 (teal)", name: "hero_headline_2", widget: "string", default: "built for the way things really work." }
          - { label: "Hero — body paragraph", name: "hero_body", widget: "text" }
          - { label: "Hero photo", name: "hero_image", widget: "image", required: false, hint: "Upload a new photo to replace the hero image. Recommended size 900×675 px or similar landscape." }
          - { label: "About — heading", name: "about_heading", widget: "string", default: "About EasyFlux" }
          - { label: "About — paragraph 1", name: "about_p1", widget: "text" }
          - { label: "About — paragraph 2", name: "about_p2", widget: "text" }
          - { label: "About — paragraph 3", name: "about_p3", widget: "text" }
          - { label: "Africa map image", name: "africa_image", widget: "image", required: false, hint: "Upload a map of Africa to display in the About section." }
          - { label: "Contact — email", name: "contact_email", widget: "string", default: "info@easyfluxconsulting.com" }
          - { label: "Contact — LinkedIn URL", name: "contact_linkedin", widget: "string", default: "https://linkedin.com/company/easyflux-consulting" }

  - name: "uploads"
    label: "Image library"
    description: "Upload, browse and delete images used on the site."
    folder: "public/uploads"
    create: true
    media_folder: ""
    public_folder: ""
    extension: "md"
    fields:
      - { label: "Caption", name: "caption", widget: "string", required: false }
