backend:
  name: git-gateway
  branch: main

# Where uploaded images live in the repo
media_folder: "public/uploads"
# How those images are referenced from inside the site
public_folder: "/uploads"

# Friendlier site title in the admin
site_url: https://easyflux-consulting.netlify.app
display_url: https://easyflux-consulting.netlify.app
logo_url: https://easyflux-consulting.netlify.app/favicon.svg

collections:
  - name: "site"
    label: "Site content"
    description: "Edit the main pieces of text on your homepage. Save to publish."
    files:
      - file: "public/content/site.json"
        label: "Homepage"
        name: "homepage"
        format: "json"
        fields:
          - { label: "Hero — line 1 (navy)", name: "hero_headline_1", widget: "string" }
          - { label: "Hero — line 2 (teal)", name: "hero_headline_2", widget: "string" }
          - { label: "Hero — body paragraph", name: "hero_body", widget: "text" }
          - { label: "Hero photo", name: "hero_image", widget: "image", required: false, hint: "Upload a new photo. Landscape orientation works best (about 4:3 ratio)." }
          - { label: "About — heading", name: "about_heading", widget: "string" }
          - { label: "About — tagline line 1 (teal)", name: "about_tagline_1", widget: "string" }
          - { label: "About — tagline line 2 (coral italic)", name: "about_tagline_2", widget: "string" }
          - { label: "About — paragraph 1", name: "about_p1", widget: "text" }
          - { label: "About — paragraph 2", name: "about_p2", widget: "text" }
          - { label: "About — paragraph 3", name: "about_p3", widget: "text" }
          - { label: "About — Africa image", name: "africa_image", widget: "image", required: false }
          - { label: "Readiness Check — heading", name: "readiness_heading", widget: "string" }
          - { label: "Readiness Check — question", name: "readiness_question", widget: "text" }
          - { label: "Readiness Check — body", name: "readiness_body", widget: "text" }
          - { label: "Contact — email", name: "contact_email", widget: "string" }
          - { label: "Contact — LinkedIn URL", name: "contact_linkedin", widget: "string" }
